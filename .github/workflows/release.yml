name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

      - name: build quickadbackup.exe
        run: go build -trimpath -ldflags "-s -w" -o dist\quickadbackup.exe .

      - name: build quickadbackup-gui.exe
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist\quickadbackup-gui.exe .\cmd\gui

      - name: package
        run: |
          Copy-Item README.md, LICENSE dist\
          $zip = "QuickADBackup-$env:GITHUB_REF_NAME-windows-amd64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip -Force
          (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() | Set-Content -Encoding ascii SHA256
          "ZIP=$zip" | Add-Content $env:GITHUB_ENV

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title $env:GITHUB_REF_NAME `
            --generate-notes `
            --verify-tag `
            $env:ZIP SHA256
